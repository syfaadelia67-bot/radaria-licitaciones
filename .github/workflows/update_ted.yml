name: Update TED live data

on:
  push:
    branches: [main, "agent/**"]
    paths:
      - "scripts/fetch_ted.py"
      - "scripts/normalize_country_names.py"
      - "scripts/translate_to_english.py"
      - "scripts/validate_live_data.py"
      - "scripts/generate_site.py"
      - "scripts/generate_brief.py"
      - "scripts/score_founder_application.py"
      - "data-loader.js"
      - "data/live/translation-cache.json"
      - "data/live/translation-status.json"
      - "tests/**"
      - ".github/workflows/update_ted.yml"
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: ted-live-data
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run normalization and generation tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Compile Python scripts
        run: python -m py_compile scripts/fetch_ted.py scripts/normalize_country_names.py scripts/translate_to_english.py scripts/validate_live_data.py scripts/generate_site.py scripts/generate_brief.py scripts/score_founder_application.py
      - name: Check JavaScript syntax
        run: node --check data-loader.js

  update:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch into temporary files
        run: |
          mkdir -p /tmp/tendersignal-live
          python scripts/fetch_ted.py \
            --days 14 \
            --limit 100 \
            --output /tmp/tendersignal-live/opportunities.json \
            --metadata /tmp/tendersignal-live/metadata.json
      - name: Normalize country names
        run: python scripts/normalize_country_names.py /tmp/tendersignal-live/opportunities.json
      - name: Add bounded cached English display layer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/translate_to_english.py \
            /tmp/tendersignal-live/opportunities.json \
            --cache data/live/translation-cache.json \
            --status data/live/translation-status.json \
            --model openai/gpt-4.1-mini \
            --batch-size 1 \
            --max-new-translations 8 \
            --request-timeout 45
          cat data/live/translation-status.json
      - name: Validate before replacing last known good data
        run: python scripts/validate_live_data.py /tmp/tendersignal-live/opportunities.json
      - name: Publish validated data
        run: |
          cp /tmp/tendersignal-live/opportunities.json data/live/opportunities.json
          cp /tmp/tendersignal-live/metadata.json data/live/metadata.json
      - name: Generate stable pages and discovery feeds
        run: |
          python scripts/generate_site.py \
            --data /tmp/tendersignal-live/opportunities.json \
            --metadata /tmp/tendersignal-live/metadata.json \
            --output-root .
      - name: Generate public market brief and reusable posts
        run: |
          python scripts/generate_brief.py \
            --data /tmp/tendersignal-live/opportunities.json \
            --metadata /tmp/tendersignal-live/metadata.json \
            --output-root .
      - name: Verify generated output
        run: |
          test -s sitemap.xml
          test -s feed.xml
          test -s brief/index.html
          test -s brief/latest.md
          test -s distribution/latest-posts.md
          test -s brief-sitemap.xml
          test -s data/live/translation-cache.json
          test -s data/live/translation-status.json
          python - <<'PY'
          import json
          from pathlib import Path
          site = json.loads(Path('data/live/generated-manifest.json').read_text(encoding='utf-8'))
          brief = json.loads(Path('data/live/brief-manifest.json').read_text(encoding='utf-8'))
          records = json.loads(Path('data/live/opportunities.json').read_text(encoding='utf-8'))
          translation = json.loads(Path('data/live/translation-status.json').read_text(encoding='utf-8'))
          assert site['record_count'] > 0
          assert brief['record_count'] == site['record_count']
          assert translation['record_count'] == site['record_count']
          assert 0 <= translation['english_display_count'] <= translation['record_count']
          assert all(not (len(item['country']) in (2, 3) and item['country'].isupper()) for item in records)
          assert all(item.get('translation', {}).get('status') in {'source_english', 'machine_translated', 'original_only'} for item in records)
          for item in records:
              if item['translation']['status'] == 'machine_translated':
                  assert item.get('original_title') and item.get('original_description')
          for page in site['pages']:
              assert Path(page['path']).is_file(), page['path']
          for generated in brief['files']:
              assert Path(generated).is_file(), generated
          print(f"Verified {site['record_count']} pages plus bounded English layer and market brief")
          PY
      - name: Commit changed data, pages and distribution assets
        run: |
          if git diff --quiet -- data/live opportunities sitemap.xml feed.xml brief brief-sitemap.xml distribution; then
            echo "No live data or generated-output changes"
            exit 0
          fi
          git config user.name "tendersignal-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live opportunities sitemap.xml feed.xml brief brief-sitemap.xml distribution
          git commit -m "Update live TED opportunities, English layer and distribution assets"
          git push
