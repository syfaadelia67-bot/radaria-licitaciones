name: Validate prototype

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate opportunity data
        run: python scripts/validate_data.py

      - name: Validate lead capture integrity
        run: python scripts/validate_lead_capture.py

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check data-loader.js
          node --check lead-config.js
          node --check lead-capture.js

      - name: Compile Python validation scripts
        run: python -m py_compile scripts/validate_data.py scripts/validate_lead_capture.py
